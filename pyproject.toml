[project]
name = "dapi"
version = "0.1.0"
description = "AI-assisted API reverse engineering: capture authorized traffic with mitmproxy, catalog endpoints, map auth flows, and generate API clients via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dapi contributors" }]
keywords = ["mitmproxy", "mcp", "api", "reverse-engineering", "openapi", "codegen", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "mitmproxy>=11.0",
  "mcp>=1.10",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dapi = "dapi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
